[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-two-phase-commit"
version = "1.0.0"
description = "2PC (Two-Phase Commit) distributed transaction protocol"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "2pc", "distributed-transactions", "consistency", "protocols"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-two-phase-commit"
Repository = "https://github.com/ElNeMeR70/py-two-phase-commit"
